stages:
  - build
  - update-manifests
  - bootstrap

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  FF_NETWORK_PER_BUILD: "true"

### ============================================ ###
### Add app images to GitLabs container registry ###
### ============================================ ###

.build_images_base:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  retry:
    max: 2
    when: 
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build_frontend:
  extends: .build_images_base
  stage: build
  script:
    # Build and push backend
    - docker build 
        -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA 
        -t $CI_REGISTRY_IMAGE/frontend:latest 
        ./app/frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  rules:
    - changes:
        - app/frontend/**/*

build_backend:
  extends: .build_images_base
  stage: build
  script:
    # Build and push backend
    - docker build 
        -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
        -t $CI_REGISTRY_IMAGE/backend:latest 
        ./app/backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  rules:
    - changes:
        - app/backend/**/*

