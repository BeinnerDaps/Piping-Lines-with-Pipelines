# ---------------------------------------------------------
# BASE default for /kubernetes/base/observability/loki-base.yaml
# ---------------------------------------------------------

# Enforce a scalable architecture for production
deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  # Index & Storage Schema Definition
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
          
  # Pod Anti-Affinity for High Availability
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: ["loki"]
        topologyKey: "kubernetes.io/hostname"

# Enforce PVCs and deterministic resources
write:
  replicas: 1
  persistence:
    size: 50Gi
    storageClass: standard
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

read:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi