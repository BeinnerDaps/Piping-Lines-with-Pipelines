apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-stack
  namespace: argocd
  annotations:
    # Prevents parent applications from deleting this Application object
    argocd.argoproj.io/sync-options: PreventDeletion=true
spec:
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators: # The generator defines the variables that will be injected into the template
    - list:
        elements:
          - env: dev
            cluster_url: https://kubernetes.default.svc
          # - env: prod
          #   cluster_url: https://kubernetes.default.svc # Change to prod-cluster in actual prod deployment
  template:
    metadata:
      name: alloy-cluster-ops
      namespace: argocd
    spec:
      project: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      sources:
        # Source 1: Grafana Alloy public Helm chart
        - repoURL: https://grafana-community.github.io/helm-charts
          chart: alloy
          targetRevision: 0.2.0 # Check for the latest stable Alloy chart version
          helm:
            valueFiles:
              # Base definition applied first
              - $values/kubernetes/base/observability/alloy-base.yaml
              # Environment specific mutations applied second
              - $values/kubernetes/overlays/{{env}}/observability/alloy-patch.yaml
        
        # Source 2: GitLab repo containing the overrides
        - repoURL: 'https://gitlab.stratpoint.cloud/devops-bootcamp/interns-batch2026-2/devops-magdamo-bien/piping-devops-pipelines.git'
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{cluster_url}}' # generator.list.elements.cluster_url
        namespace: observability