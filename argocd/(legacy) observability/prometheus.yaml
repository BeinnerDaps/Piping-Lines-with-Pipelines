apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-stack
  namespace: argocd
  annotations:
    # Prevents parent applications from deleting this Application object
    argocd.argoproj.io/sync-options: PreventDeletion=true
spec:
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators: # The generator defines the variables that will be injected into the template
    - list:
        elements:
          - env: dev
            cluster_url: https://kubernetes.default.svc
  template:
    metadata:
      name: prometheus-cluster-ops
      namespace: argocd
    spec:
      project: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            observability: enabled
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      sources:
        # Source 1: Prometheus public Helm chart
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 87.7.0
          helm:
            valueFiles:
              # Base definition applied first
              - $values/kubernetes/base/observability/prometheus-base.yaml
              # Environment specific mutations applied second
              - $values/kubernetes/overlays/{{env}}/observability/prometheus-patch.yaml
            parameters:
              - name: grafana.additionalDataSources[0].url
                value: 'http://loki-cluster-ops:3100'
              - name: grafana.additionalDataSources[1].url
                value: 'http://tempo-cluster-ops:3100'
        # Source 2: GitLab repo containing the overrides
        - repoURL: 'https://gitlab.stratpoint.cloud/devops-bootcamp/interns-batch2026-2/devops-magdamo-bien/piping-devops-pipelines.git' 
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{cluster_url}}' # generator.list.elements.cluster_url
        namespace: observability